<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>nestegg</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700&display=swap">
<style>
:root{--bg:oklch(.245 0 0);--surface:oklch(.285 0 0);--raised:oklch(.335 0 0);--text:oklch(.94 0 0);--muted:oklch(.75 0 0);--accent:oklch(.86 .06 150);--error:oklch(.79 .075 25);--warning:oklch(.81 .075 80);--ok:oklch(.79 .035 150);--line:oklch(.40 0 0);--input-line:oklch(.58 0 0)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Manrope,sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit}a{color:inherit;text-underline-offset:5px;text-decoration-thickness:1px}a:hover{text-decoration:underline}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,input,select{border-radius:6px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}h1,h2,h3,p{margin:0}h1{font-size:32px;line-height:1.27;letter-spacing:-.035em;font-weight:600;text-wrap:balance}h2{font-size:22px;line-height:1.4;letter-spacing:-.025em;font-weight:600}h3{font-size:16px;font-weight:650}p{max-width:65ch;text-wrap:pretty}small,.small{font-size:14px}.muted{color:var(--muted)}.error{color:var(--error)}.warning{color:var(--warning)}.ok{color:var(--ok)}.frame{max-width:800px;margin:auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;padding:32px 0 30px;gap:24px}header>a{font-weight:700;font-size:22px;letter-spacing:-.035em;text-decoration:none}header nav{display:flex;gap:28px;font-size:14px}header nav a{text-decoration:none;color:var(--muted)}header nav a[aria-current=page]{color:var(--text);text-decoration:underline}main{padding:18px 0 64px;outline:none;min-height:75vh}.intro{margin-bottom:36px}.intro .small{margin-bottom:18px}.intro p{margin-top:14px}.section{margin-top:42px}.section>h2{margin-bottom:16px}.attention{background:var(--surface);border-radius:8px;padding:4px 24px}.attention-row{padding:20px 0}.attention-row+.attention-row{border-top:1px solid var(--line)}.attention-row h3 a{text-decoration:underline}.attention-row p{margin-top:5px;font-size:14px;color:var(--muted)}.status-label{font-size:14px}.pc-row{padding:23px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}.pc-row:first-child{padding-top:2px}.pc-name{font-weight:650;text-decoration:none}.pc-name:hover{text-decoration:underline}.pc-row p{font-size:14px;margin-top:4px;color:var(--muted)}.row-status{font-size:14px;text-align:right;flex-shrink:0}.local-label{font-weight:400;color:var(--muted);margin-left:12px;font-size:14px}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:0;text-decoration:none;font-size:14px;font-weight:650;text-align:center}.primary{background:var(--accent);color:var(--bg);border-radius:6px}.primary:hover{background:oklch(.90 .06 150);text-decoration:none}.secondary{background:var(--raised);color:var(--text);border-radius:6px}.secondary:hover{background:var(--line);text-decoration:none}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-top:28px}.actions>a:not(.primary):not(.secondary){font-size:14px}.back{display:inline-block;font-size:14px;color:var(--muted);margin-bottom:26px}.section-note{font-size:14px;color:var(--muted);margin-top:18px}.report{padding:24px;background:var(--surface);border-radius:8px;margin-top:28px}.report p{margin-top:8px}.report .actions{margin-top:20px}.detail-status{margin-top:12px}.facts{margin:0}.facts>div{display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-bottom:1px solid var(--line)}.facts dt{color:var(--muted)}.facts dd{margin:0;text-align:right;overflow-wrap:anywhere}.facts>div:last-child{border-bottom:0}details{margin-top:26px}summary{cursor:pointer;font-size:14px;min-height:44px;align-content:center;color:var(--muted)}details[open]>summary{margin-bottom:12px}.timeline{list-style:none;padding:0;margin:0}.timeline li{display:grid;grid-template-columns:94px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.timeline time{color:var(--muted);font-size:14px}.timeline strong{font-size:14px;font-weight:600}.timeline p{color:var(--muted);font-size:14px;margin-top:4px}.meter{height:6px;background:var(--raised);border-radius:2px;overflow:hidden;margin:18px 0 8px}.meter span{display:block;background:var(--muted);height:100%;width:61%}.footer{font-size:14px;color:var(--muted);padding:24px 0 32px;border-top:1px solid var(--line)}code,pre{font-family:ui-monospace,monospace;font-size:14px;overflow-wrap:anywhere}pre{white-space:pre-wrap;margin:16px 0;background:var(--surface);padding:20px;border-radius:6px}.steps{display:flex;list-style:none;gap:24px;padding:0;margin:0 0 28px;font-size:14px;color:var(--muted)}.steps li[aria-current=step]{color:var(--text);text-decoration:underline;text-underline-offset:8px}.steps span{margin-right:8px}.field{margin-top:24px}.field label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}input[type=text],input[type=search],select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--input-line);padding:12px;min-height:48px}input::placeholder{color:var(--muted)}.field p{font-size:14px;color:var(--muted);margin-top:8px}.date-list{margin-top:26px}.date-choice{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}.date-choice small{display:block;color:var(--muted);margin-top:2px}.date-choice input{margin:0}.date-choice>span{flex:1}input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}.tree{margin-top:24px;background:var(--surface);border-radius:8px;padding:10px 20px}.tree details{margin:0}.tree summary{font-size:16px;color:var(--text);padding:10px 0}.tree .branch{margin-left:22px}.file-row{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;min-width:0}.file-row span{min-width:0;overflow-wrap:anywhere}.file-row small{margin-left:auto;color:var(--muted);white-space:nowrap}.file-row input{margin:0}.tree p{padding:20px 0}.selection{margin-top:18px;font-size:14px;color:var(--muted)}.paths{padding-left:20px;margin:8px 0}.paths li{padding:5px 0;overflow-wrap:anywhere}.progress{margin-top:28px;height:7px;background:var(--raised);border-radius:2px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);transition:width .25s ease-out}.run-stage{margin-top:16px}.stage-list{padding:0;margin:24px 0 0;list-style:none}.stage-list li{padding:8px 0;color:var(--muted);font-size:14px}.stage-list li.active{color:var(--text)}.stage-list li.done{color:var(--ok)}.inline-note{margin-top:18px;font-size:14px;color:var(--muted)}.local-settings{margin-top:12px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.skip{position:absolute;top:-100px;left:20px;background:var(--accent);color:var(--bg);padding:8px 16px;z-index:1}.skip:focus{top:10px}.nowrap{white-space:nowrap}
@media(max-width:600px){.frame{padding:0 24px}header{padding:25px 0;gap:16px}header nav{gap:18px}main{padding-top:20px}.intro{margin-bottom:30px}.attention{padding:2px 18px}.pc-row{align-items:flex-start;gap:12px;flex-wrap:wrap}.pc-row>div:first-child{flex:1;min-width:190px}.row-status{text-align:left;flex-basis:100%}.pc-row .primary{margin-top:4px;width:100%}.local-label{display:block;margin-left:0;margin-top:2px}.report{padding:20px}.facts>div{display:block;padding:14px 0}.facts dd{text-align:left;margin-top:4px}.timeline{margin-top:8px}.timeline li{grid-template-columns:72px 1fr;gap:14px}.steps{gap:16px;justify-content:space-between}.steps span{display:block;margin:0 0 2px}.tree{padding:8px 14px}.tree .branch{margin-left:14px}.file-row{gap:9px}.file-row small{font-size:14px}.actions{gap:20px}.actions .primary{width:100%}.section{margin-top:36px}h1{font-size:32px}.footer{padding-bottom:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a href="#main" class="skip" onclick="event.preventDefault();document.getElementById('main').focus()">Zum Inhalt</a>
<div class="frame"><header><a href="#overview" aria-label="nestegg Übersicht">nestegg</a><nav aria-label="Hauptnavigation"><a id="nav-overview" href="#overview">Übersicht</a><a id="nav-settings" href="#settings">Einstellungen</a></nav></header><main id="main" tabindex="-1"></main><footer class="footer">Klickbarer Entwurf. Alle Daten sind Beispiele; Aktionen werden simuliert.</footer></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<script>
'use strict';
const pcs=[
{id:'desktop',name:'Arbeitsrechner',host:'desktop.example.com',user:'alice',os:'Linux Mint 22.2',size:'412 GB',health:'ok',key:true,date:'So., 8. Nov. 2026',time:'01:42',status:'Gesichert',local:true},
{id:'laptop',name:'Laptop',host:'laptop.example.com',user:'bob',os:'Ubuntu 24.04',size:'188 GB',health:'overdue',key:true,date:'Fr., 30. Okt. 2026',time:'01:46',status:'Überfällig'},
{id:'media',name:'Wohnzimmer-PC',host:'media.example.com',user:'alice',os:null,size:'1,1 TB',health:'failing',key:false,date:'Di., 3. Nov. 2026',time:'02:08',status:'Sicherung fehlgeschlagen'},
{id:'workshop',name:'Werkstatt',host:'workshop.example.com',user:'bob',os:null,size:'96 GB',health:'ok',key:true,date:'So., 8. Nov. 2026',time:'08:16',status:'Nachgeholt'}
];
const archiveFiles={'home.pxar':[
{path:'/alice/Dokumente/Haushalt.pdf',name:'Haushalt.pdf',mb:2.4,folder:'Dokumente'},
{path:'/alice/Dokumente/Notizen.odt',name:'Notizen.odt',mb:.1,folder:'Dokumente'},
{path:'/alice/Dokumente/Unterlagen.pdf',name:'Unterlagen.pdf',mb:4.5,folder:'Dokumente'},
{path:'/alice/Bilder/Garten.jpg',name:'Garten.jpg',mb:5.2,folder:'Bilder'},
{path:'/alice/Bilder/November.jpg',name:'November.jpg',mb:6.8,folder:'Bilder'}
], 'etc.pxar':[{path:'/fstab',name:'fstab',mb:.002,folder:''},{path:'/hostname',name:'hostname',mb:.001,folder:''}], 'root.pxar':[{path:'/Wartung.txt',name:'Wartung.txt',mb:.01,folder:''}], 'usr-local.pxar':[{path:'/bin/haushalt.sh',name:'haushalt.sh',mb:.02,folder:'bin'}], 'inventory.pxar':[{path:'/packages.txt',name:'packages.txt',mb:.3,folder:''},{path:'/services.txt',name:'services.txt',mb:.1,folder:''}]};
let files=archiveFiles['home.pxar'];
const archiveRoots={'home.pxar':'/home','etc.pxar':'/etc','root.pxar':'/root','usr-local.pxar':'/usr/local','inventory.pxar':'Systeminventar'};
const originalPath=f=>archiveRoots[state.archive]+f.path;
const state={archive:'home.pxar',date:'2026-11-08',selected:new Set(),folder:'nestegg-restore-2026-11-08',run:null,mode:'success',timer:null,restoreDone:false,check:null};
const app=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pc=id=>pcs.find(p=>p.id===id)||pcs[0];
const back=(text='Zur Übersicht',href='#overview')=>`<a class="back" href="${href}">${text}</a>`;
const link=(label,href,cls='primary')=>`<a class="${cls}" href="${href}">${label}</a>`;
const tone=p=>p.health==='failing'?'error':p.health==='overdue'?'warning':'ok';
const intro=(title,sub='',pre='')=>`<div class="intro">${pre?`<p class="small muted">${pre}</p>`:''}<h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>`;
const facts=rows=>`<dl class="facts">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const selected=()=>files.filter(f=>state.selected.has(f.path));
const formatSize=mb=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}).format(mb>0&&mb<1?mb*1000:mb)+(mb>0&&mb<1?' KB':' MB');
const size=()=>formatSize(selected().reduce((n,f)=>n+f.mb,0));
const dates={'2026-11-08':'So., 8. November 2026, 01:42','2026-11-07':'Sa., 7. November 2026, 01:39','2026-11-06':'Fr., 6. November 2026, 01:44','2026-10-31':'Sa., 31. Oktober 2026, 01:40'};
function overview(){const active=state.run&&!state.run.finished;return `${intro(active?'Dieser PC wird gerade gesichert.':'Dieser PC ist gesichert.','Zwei andere PCs brauchen Aufmerksamkeit.','Sonntag, 8. November 2026')}<section aria-labelledby="attention-title"><h2 id="attention-title" class="sr-only">Aufmerksamkeit erforderlich</h2><div class="attention"><div class="attention-row"><h3><a href="#pc/laptop">Laptop</a> <span class="status-label warning">ist überfällig</span></h3><p>Seit 9 Nächten ausgeschaltet. Holt die Sicherung beim Einschalten automatisch nach.</p></div><div class="attention-row"><h3><a href="#pc/media">Wohnzimmer-PC</a> <span class="status-label error">hat nicht gesichert</span></h3><p>Der Foto-Ordner fehlt. Außerdem gibt es keine Kopie des Verschlüsselungsschlüssels.</p></div></div></section><section class="section" aria-labelledby="pcs-title"><h2 id="pcs-title">Deine PCs</h2>${pcs.map(p=>`<div class="pc-row"><div><a class="pc-name" href="#pc/${p.id}">${p.name}</a>${p.local?'<span class="local-label">Dieser PC</span>':''}<p>${p.local&&active?'Sicherung läuft':p.id==='laptop'?'Letzte Sicherung am 30. Oktober':p.id==='media'?'Fehler am 4. November':p.id==='workshop'?'Heute um 08:16 nachgeholt':'Heute Nacht um 01:42 gesichert'}</p></div>${p.local?link(active?'Fortschritt ansehen':'Jetzt sichern','#run/desktop'):`<span class="row-status ${tone(p)}">${p.status}</span>`}</div>`).join('')}<p class="section-note">Andere PCs zeigen ihren zuletzt an den Server gemeldeten Stand. Du verwaltest sie auf dem jeweiligen PC.</p></section><section class="section"><details><summary>Backup-Server und letzte gemeinsame Störung</summary><p class="small muted">Der Server schläft zwischen den Sicherungen. Er wird nachts um 01:30 geweckt.</p><div class="meter" role="meter" aria-label="Serverspeicher belegt" aria-valuenow="61" aria-valuemin="0" aria-valuemax="100"><span></span></div><p class="small muted">61 % belegt, 1,4 TB frei</p><div class="report"><h3>1. November: Server nicht erreichbar</h3><p class="small muted">Der Server ist nicht aufgewacht. Alle vier PCs haben diese Nacht verpasst. Es wurde keine Sicherung gestartet.</p></div><div class="actions">${link('Serverdetails ansehen','#server','secondary')}</div></details></section>`}
function detail(p){let report='';if(p.id==='laptop')report=`<div class="report"><h2 class="warning">Seit 9 Nächten überfällig</h2><p>Der Laptop war ausgeschaltet. Sobald er eingeschaltet wird, holt nestegg die verpasste Sicherung automatisch nach.</p><p class="small muted">Bitte am Laptop einschalten und den neuen Sicherungsstand dort prüfen.</p></div>`;if(p.id==='media')report=`<div class="report"><h2 class="error">Der Foto-Ordner war nicht eingebunden.</h2><p>Die Sicherung vom 4. November ist fehlgeschlagen, weil <code>/mnt/fotos</code> nicht verfügbar war. Die letzte vollständige Sicherung ist vom 3. November.</p><p class="small muted">Am Wohnzimmer-PC das Laufwerk verbinden und die Sicherung erneut starten.</p></div><section class="section"><h2 class="warning">Schlüsselkopie fehlt</h2><p class="inline-note">Der Schlüssel liegt nur auf dem Wohnzimmer-PC. Geht dieser PC kaputt, lassen sich seine verschlüsselten Sicherungen nicht mehr öffnen.</p><p class="inline-note">Auf dem Wohnzimmer-PC den Schlüssel exportieren und eine Kopie an einem anderen sicheren Ort aufbewahren.</p></section>`;if(p.id==='workshop')report=`<div class="report"><h2>Heute Morgen nachgeholt</h2><p>Die Werkstatt war um 01:30 ausgeschaltet. Beim Einschalten wurde die Sicherung um 08:16 automatisch nachgeholt.</p><p class="small muted">Das passiert hier häufig und gehört zum normalen Ablauf.</p></div>`;return `${back()}${intro(p.name,p.local?'Dieser PC. Hier kannst du sichern und Dateien wiederherstellen.':'Status vom Backup-Server. Verwalten kannst du diesen PC nur vor Ort.')}<p class="detail-status ${tone(p)}">${p.status}${p.id==='desktop'?' heute um 01:42':''}</p>${p.local?`<div class="actions">${link('Jetzt sichern','#run/desktop')}<a href="#restore/1">Dateien wiederherstellen</a></div>`:''}${report}<section class="section"><h2>Letzte vollständige Sicherung</h2>${facts([['Datum',p.date+' um '+p.time],['Gesicherte Daten',p.size],['Verschlüsselung','Aktiv'],['Schlüsselkopie',p.key?'Außerhalb des PCs aufbewahrt':'Keine Kopie gemeldet']])}</section><section class="section"><h2>Letzte Ereignisse</h2><ul class="timeline">${p.id==='media'?'<li><time>4. Nov.</time><div><strong class="error">Sicherung fehlgeschlagen</strong><p>Quelle <code>/mnt/fotos</code> nicht eingebunden.</p></div></li>':p.id==='laptop'?'<li><time>30. Okt.</time><div><strong>Letzte erfolgreiche Sicherung</strong><p>Seitdem war der Laptop ausgeschaltet.</p></div></li>':`<li><time>8. Nov.</time><div><strong>${p.id==='workshop'?'Sicherung nachgeholt':'Sicherung abgeschlossen'}</strong><p>${p.id==='workshop'?'Beim Einschalten um 08:16.':'Heute Nacht um 01:42.'}</p></div></li>`}<li><time>1. Nov.</time><div><strong>Server nicht erreichbar</strong><p>Server nicht aufgewacht. Alle vier PCs betroffen; keine Sicherung gestartet.</p></div></li></ul></section><details><summary>Technische Angaben${p.local?' und gesicherte Ordner':''}</summary>${facts([['Hostname',p.host],['Benutzer',p.user],...(p.os?[['Betriebssystem',p.os]]:[])])}${p.local?'<p class="inline-note">Gesichert werden <code>/home</code>, <code>/etc</code>, <code>/root</code> und <code>/usr/local</code> sowie ein Systeminventar mit installierten Paketen, Diensten und Laufwerken.</p><div class="actions"><a href="#settings">Konfiguration ansehen</a></div>':''}</details>${!p.local?'<p class="section-note">Nur lesbare Ansicht. Der Stand kann veraltet sein, solange dieser PC nicht erneut sichert.</p><div class="actions">'+link('Zur Übersicht','#overview')+'</div>':''}`}
function steps(n){return `<ol class="steps" aria-label="Wiederherstellungsschritte">${['Sicherung','Dateien','Zielordner'].map((s,i)=>`<li ${n===i+1?'aria-current="step"':''}><span>${i+1}</span>${s}</li>`).join('')}</ol>`}
function restoreOne(){return `${back('Zum Arbeitsrechner','#pc/desktop')}${steps(1)}${intro('Von wann brauchst du die Dateien?','Wähle eine vollständige Sicherung dieses PCs.','Arbeitsrechner, dieser PC')}<form onsubmit="event.preventDefault();location.hash='restore/2'"><div class="date-list">${Object.entries(dates).map(([v,d],i)=>`<label class="date-choice"><input type="radio" name="snapshot" value="${v}" ${state.date===v?'checked':''} onchange="state.date=this.value"><span>${d}<small>${i===0?'Neueste Sicherung, 412 GB':'Vollständige Sicherung'}</small></span></label>`).join('')}</div><p class="section-note">Am 1. November gibt es keine Sicherung: Der Server war nicht erreichbar.</p><div class="actions"><button class="primary" type="submit">Dateien auswählen</button></div></form>`}
function fileRow(f){return `<label class="file-row"><input type="checkbox" data-path="${esc(f.path)}" ${state.selected.has(f.path)?'checked':''} onchange="toggleFile(this)"><span>${f.name}</span><small>${formatSize(f.mb)}</small></label>`}
function tree(query=''){const found=files.filter(f=>(f.path).toLocaleLowerCase('de').includes(query.toLocaleLowerCase('de')));return query?found.length?found.map(f=>`<div><p class="small muted" style="padding:8px 0 0"><code>${esc(originalPath(f).slice(0,originalPath(f).lastIndexOf('/')))}</code></p>${fileRow(f)}</div>`).join(''):'<p class="muted">Keine Dateien gefunden. Versuche einen anderen Namen.</p>':state.archive!=='home.pxar'?`<details open><summary>${state.archive}</summary>${files.map(fileRow).join('')}</details>`:`<details open><summary>home.pxar</summary><div class="branch"><details open><summary>alice</summary><div class="branch">${['Dokumente','Bilder'].map(folder=>`<details open><summary>${folder}</summary><div class="branch"><label class="file-row"><input type="checkbox" data-folder="${folder}" onchange="toggleFolder(this)"><span class="small muted">Ordner auswählen</span></label>${files.filter(f=>f.folder===folder).map(fileRow).join('')}</div></details>`).join('')}</div></details></div></details>`}
function restoreTwo(){return `${back('Sicherung ändern','#restore/1')}${steps(2)}${intro('Was möchtest du zurückholen?',dates[state.date],'Arbeitsrechner, dieser PC')}<div class="field"><label for="archive">Gesicherter Bereich</label><select id="archive" onchange="chooseArchive(this.value)">${Object.entries(archiveRoots).map(([a,path])=>`<option value="${a}" ${state.archive===a?'selected':''}>${path}</option>`).join('')}</select></div><div class="field"><label for="search">Dateien oder Ordner suchen</label><input type="search" id="search" placeholder="Zum Beispiel Haushalt.pdf" oninput="searchFiles(this.value)"></div><div id="file-tree" class="tree">${tree()}</div><p class="selection" id="selection" role="status">${selectionText()}</p><div class="actions"><button class="primary" id="next-target" ${state.selected.size?'':'disabled'} onclick="location.hash='restore/3'">Zielordner wählen</button></div><p class="section-note">Die Auswahl gehört zum Archiv <code id="archive-label">${state.archive}</code>. Für einen anderen Bereich startest du anschließend eine weitere Wiederherstellung.</p>`}
function chooseArchive(archive){state.archive=archive;document.getElementById('archive-label').textContent=archive;files=archiveFiles[archive];state.selected.clear();document.getElementById('search').value='';document.getElementById('file-tree').innerHTML=tree();updateSelection();document.getElementById('announcer').textContent='Bereich gewechselt. Auswahl zurückgesetzt.'}
function selectionText(){return state.selected.size?`${state.selected.size} Dateien ausgewählt, ${size()}`:'Noch nichts ausgewählt. Wähle Dateien oder einen ganzen Ordner.'}
function updateSelection(){document.getElementById('selection').textContent=selectionText();document.getElementById('next-target').disabled=!state.selected.size;document.querySelectorAll('[data-folder]').forEach(e=>{const group=files.filter(f=>f.folder===e.dataset.folder),n=group.filter(f=>state.selected.has(f.path)).length;e.checked=n===group.length;e.indeterminate=n>0&&n<group.length})}
function toggleFile(e){e.checked?state.selected.add(e.dataset.path):state.selected.delete(e.dataset.path);updateSelection()}
function toggleFolder(e){files.filter(f=>f.folder===e.dataset.folder).forEach(f=>e.checked?state.selected.add(f.path):state.selected.delete(f.path));document.querySelectorAll('[data-path]').forEach(c=>c.checked=state.selected.has(c.dataset.path));updateSelection()}
function searchFiles(q){document.getElementById('file-tree').innerHTML=tree(q);updateSelection()}
function restoreThree(){if(!state.selected.size)return `${back('Dateien auswählen','#restore/2')}${intro('Wähle zuerst die Dateien aus.')}<div class="actions">${link('Dateien auswählen','#restore/2')}</div>`;return `${back('Auswahl ändern','#restore/2')}${steps(3)}${intro('Zurück in einen neuen Ordner.','Deine heutigen Dateien bleiben erhalten. Es wird nichts überschrieben.')}<form onsubmit="finishRestore(event)"><div class="field"><label for="folder">Name des neuen Ordners</label><input type="text" id="folder" value="${esc(state.folder)}" required maxlength="100" oninput="changeFolder(this)"><p>Wird in <code>/home/alice/</code> auf Arbeitsrechner angelegt. Der Ordner darf noch nicht existieren.</p></div><section class="section"><h2>Deine Wiederherstellung</h2>${facts([['Sicherung',dates[state.date]],['Auswahl',`${state.selected.size} Dateien, ${size()}`],['Ziel',`<code id="target-path">/home/alice/${esc(state.folder)}</code>`]])}<ul class="paths">${selected().map(f=>`<li><code>${esc(originalPath(f))}</code></li>`).join('')}</ul></section><p class="inline-note" id="folder-error" role="status"></p><div class="actions"><button class="primary" type="submit">In neuen Ordner wiederherstellen</button></div></form>`}
function changeFolder(e){state.folder=e.value;document.getElementById('target-path').textContent='/home/alice/'+e.value;document.getElementById('folder-error').textContent='';e.setCustomValidity('')}
function finishRestore(e){e.preventDefault();const input=document.getElementById('folder');if(['Dokumente','Bilder','.','..'].includes(state.folder)||!state.folder.trim()||state.folder.includes('/')||state.folder.includes(String.fromCharCode(92))){document.getElementById('folder-error').textContent='Dieser Ordnername ist bereits vorhanden oder ungültig. Wähle einen neuen Namen.';input.focus();return}state.restoreDone=true;location.hash='restore/done'}
function restoreDone(){return `${back('Zum Arbeitsrechner','#pc/desktop')}${intro('Wiederherstellung simuliert.','Im echten Betrieb findest du die Dateien im neuen Ordner. Deine bisherigen Dateien bleiben erhalten.')}<div class="report">${facts([['PC','Arbeitsrechner'],['Sicherung',dates[state.date]],['Auswahl',`${state.selected.size} Dateien, ${size()}`],['Neuer Ordner',`<code>/home/alice/${esc(state.folder)}</code>`]])}</div><div class="actions">${link('Zum Arbeitsrechner','#pc/desktop')}</div>`}
function runPage(){const r=state.run;return `${back('Zum Arbeitsrechner','#pc/desktop')}${intro(r?.finished?(r.result==='success'?'Sicherung abgeschlossen.':r.result==='server'?'Server nicht erreichbar.':'Sicherung fehlgeschlagen.'):'Arbeitsrechner jetzt sichern.','Dieser PC. Die Sicherung läuft auch weiter, wenn du die Ansicht wechselst.')}<div id="run-panel">${runContent()}</div><details><summary>Simulationsverlauf auswählen</summary><div class="field"><label for="run-mode">Ergebnis dieses Beispiels</label><select id="run-mode" ${r&&!r.finished?'disabled':''} onchange="state.mode=this.value"><option value="success" ${state.mode==='success'?'selected':''}>Server wacht auf, Sicherung erfolgreich</option><option value="server" ${state.mode==='server'?'selected':''}>Server wacht nicht auf</option><option value="source" ${state.mode==='source'?'selected':''}>Quellordner fehlt</option></select><p>Verkürzter Ablauf ohne Zugriff auf einen echten Server.</p></div></details>`}
function runContent(){const r=state.run;if(!r)return `<div class="report"><h2>Der Server wird bei Bedarf geweckt.</h2><p class="muted">Danach werden die Ordner geprüft, das Systeminventar erstellt und die Dateien gesichert.</p></div><div class="actions"><button class="primary" onclick="startRun()">Jetzt sichern</button></div>`;if(r.finished){let title=r.result==='success'?'Alle ausgewählten Ordner gesichert.':r.result==='server'?'Der Server ist nicht aufgewacht.':'Ein Quellordner war nicht verfügbar.';let msg=r.result==='success'?'Im Entwurf wurde eine neue Sicherung erstellt.':r.result==='server'?'Es wurde keine Sicherung gestartet. Dieser Versuch zählt als „Server nicht erreichbar“. Die nächste automatische Sicherung versucht es erneut.':'Die Sicherung wurde vor der Übertragung abgebrochen. Prüfe die eingebundenen Laufwerke auf diesem PC.';return `<div class="report"><h2 class="${r.result==='source'?'error':r.result==='server'?'warning':'ok'}">${title}</h2><p>${msg}</p><p class="small muted">Ältere vollständige Sicherungen bleiben erhalten.</p></div><div class="actions">${r.result==='success'?link('Zum Arbeitsrechner','#pc/desktop'):'<button class="primary" onclick="resetRun()">Erneut versuchen</button>'}</div>`}const labels=['Ordner prüfen','Server wird geweckt','Systeminventar erstellen','Dateien sichern','Sicherung abschließen'];return `<div class="report"><p class="small muted">Sicherung läuft</p><h2 class="run-stage" role="status">${labels[r.stage]}</h2><p class="small muted">${r.stage===1?'Wecksignal gesendet. Warte auf den Server. Maximal 5 Minuten im regulären Betrieb.':r.stage===3?'Dateien werden mit dem offiziellen Proxmox-Client übertragen.':'Der Ablauf wird vorbereitet und geprüft.'}</p><div class="progress" role="progressbar" aria-label="Simulierter Sicherungsfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.progress}"><span style="width:${r.progress}%"></span></div><p class="small muted" style="margin-top:8px">${r.progress} % im Beispielablauf</p><ol class="stage-list">${labels.map((s,i)=>`<li class="${i===r.stage?'active':i<r.stage?'done':''}">${i<r.stage?'Erledigt: ':''}${s}</li>`).join('')}</ol></div><div class="actions">${link('Zur Übersicht','#overview')}</div>`}
function startRun(){if(state.run&&!state.run.finished)return;state.run={stage:0,progress:0,finished:false,result:state.mode,tick:0};render(false);state.timer=setInterval(()=>{const r=state.run;r.tick++;r.progress=Math.min(100,r.tick*10);r.stage=r.tick<2?0:r.tick<5?1:r.tick<6?2:r.tick<9?3:4;if((r.result==='source'&&r.tick===2)||(r.result==='server'&&r.tick===5)||r.tick===10){r.finished=true;clearInterval(state.timer);document.getElementById('announcer').textContent=r.result==='success'?'Sicherung abgeschlossen':r.result==='server'?'Server nicht erreichbar':'Sicherung fehlgeschlagen';if(location.hash==='#run/desktop')render(false)}else if(location.hash==='#run/desktop'){document.getElementById('run-panel').innerHTML=runContent()}},900)}
function resetRun(){clearInterval(state.timer);state.run=null;render(false)}
function settings(){return `${back('Zum Arbeitsrechner','#pc/desktop')}${intro('Einstellungen dieses PCs.','Die wirksame Konfiguration von Arbeitsrechner. Hier kannst du sie ansehen und die Serververbindung prüfen.')}<section class="section"><h2>Backup-Server</h2>${facts([['Adresse','pbs.example.com:8007'],['Datastore','datastore'],['Namespace','zuhause'],['Server aufwecken','Aktiv, Wake-on-LAN'],['MAC-Adresse','00:00:5e:00:53:01'],['Maximale Wartezeit','5 Minuten']])}<div class="actions"><button class="primary" id="check-connection" onclick="checkConnection()">Verbindung prüfen</button></div><p class="inline-note" id="connection-result" role="status">${state.check||'Die Prüfung weckt einen schlafenden Server bei Bedarf auf.'}</p></section><section class="section"><h2>Zeitplan</h2>${facts([['Zeitfenster','Täglich von 01:30 bis 05:00'],['Verpasste Sicherungen','Beim Einschalten automatisch nachholen'],['Überfällig nach','7 Tagen ohne vollständige Sicherung'],['Aufbewahrung','7 tägliche, 4 wöchentliche, 6 monatliche Sicherungen']])}</section><details><summary>Gesicherte Ordner und Verschlüsselung</summary>${facts([['Ordner','<code>/home</code>, <code>/etc</code>, <code>/root</code>, <code>/usr/local</code>'],['Zusätzlich','Systeminventar: Pakete, Dienste und Laufwerke'],['Verschlüsselung','Aktiv'],['Schlüsselkopie','Außerhalb dieses PCs aufbewahrt']])}</details><section class="section"><h2>Konfiguration ändern</h2><p class="inline-note">Öffne auf diesem PC das Terminal und starte <code>sudo nestegg init</code>. Die Konfiguration liegt in <code>/etc/nestegg/config.toml</code>.</p><p class="inline-note">Änderungen gelten nur für diesen PC. Zugangsdaten werden hier nicht angezeigt.</p></section><details><summary>Einen weiteren PC einrichten</summary><p class="small muted">Installiere nestegg auf dem neuen PC. Richte dort mit <code>sudo nestegg init</code> den Server und die Sicherungen ein. Öffne danach mit <code>nestegg ui</code> die lokale Oberfläche.</p><p class="inline-note">Nach der ersten Sicherung erscheint der gemeldete Stand dieses PCs in der gemeinsamen Übersicht.</p></details>`}
function checkConnection(){const button=document.getElementById('check-connection');button.disabled=true;button.textContent='Verbindung wird geprüft';document.getElementById('connection-result').textContent='Server wird geweckt. Warte auf Antwort …';setTimeout(()=>{state.check='Verbindung erfolgreich geprüft (Simulation). Datastore „datastore“ und Namespace „zuhause“ sind erreichbar.';if(location.hash==='#settings'){button.disabled=false;button.textContent='Verbindung prüfen';document.getElementById('connection-result').textContent=state.check}},1800)}
function server(){return `${back()}${intro('Ein gemeinsamer Backup-Server.','Er schläft zwischen den Sicherungen und wird nachts um 01:30 geweckt.')}<div class="meter" role="meter" aria-label="Serverspeicher belegt" aria-valuenow="61" aria-valuemin="0" aria-valuemax="100"><span></span></div><p class="small muted">61 % belegt, 1,4 TB frei</p><section class="section"><h2>1. November: Server nicht erreichbar</h2><p class="inline-note">In der Nacht zum Sonntag ist der Server nicht aufgewacht. Alle vier PCs haben diese Nacht verpasst. Es wurde keine Sicherung gestartet; das ist ein eigener Zustand.</p><p class="inline-note">Die vollständigen Sicherungen davor sind weiterhin vorhanden. Seit dem 2. November ist der Server wieder erreichbar.</p></section><details><summary>Serverangaben</summary>${facts([['Adresse','pbs.example.com:8007'],['Datastore','datastore'],['Namespace','zuhause'],['MAC-Adresse','00:00:5e:00:53:01'],['Aufbewahrung','7 täglich, 4 wöchentlich, 6 monatlich']])}</details><div class="actions">${link('Lokale Verbindung prüfen','#settings')}</div>`}
function render(scroll=true){const route=(location.hash.slice(1)||'overview').split('/');switch(route[0]){case'pc':app.innerHTML=detail(pc(route[1]));break;case'restore':app.innerHTML=route[1]==='2'?restoreTwo():route[1]==='3'?restoreThree():route[1]==='done'&&state.restoreDone?restoreDone():restoreOne();if(route[1]==='2')updateSelection();break;case'run':if(route[1]!=='desktop'){location.hash='pc/'+route[1];return}app.innerHTML=runPage();break;case'settings':app.innerHTML=settings();break;case'server':app.innerHTML=server();break;default:app.innerHTML=overview()}document.getElementById('nav-overview').setAttribute('aria-current',route[0]==='overview'?'page':'false');document.getElementById('nav-settings').setAttribute('aria-current',route[0]==='settings'?'page':'false');document.title='nestegg – '+(app.querySelector('h1')?.textContent||'Übersicht');if(scroll){window.scrollTo(0,0);app.focus({preventScroll:true})}}
window.addEventListener('hashchange',()=>render());render(false);
</script>
</body>
</html>
