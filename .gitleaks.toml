# gitleaks configuration: default secret rules plus project rules that keep
# private network details and Proxmox Backup Server credentials out of Git.
# Use documentation values instead: 192.0.2.0/24, 198.51.100.0/24,
# 203.0.113.0/24, 2001:db8::/32, pbs.example.com, backup@pbs!desktop.

title = "linux-pc-backup-over-pbs"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4-address"
description = "Private, CGNAT or Tailscale IPv4 address (use 192.0.2.x / 198.51.100.x / 203.0.113.x in examples)"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168.", "100."]

[[rules]]
id = "tailscale-hostname"
description = "Tailscale MagicDNS host name"
regex = '''\b[a-z0-9-]+\.tail[0-9a-f]+\.ts\.net\b'''
keywords = [".ts.net"]

[[rules]]
id = "pbs-certificate-fingerprint"
description = "Real SHA-256 certificate fingerprint (use a placeholder such as <FINGERPRINT>)"
regex = '''\b([0-9a-fA-F]{2}:){31}[0-9a-fA-F]{2}\b'''

[[rules]]
id = "pbs-token-secret"
description = "Proxmox API token secret (UUID) next to a credential keyword"
regex = '''(?i)(pbs_password|password|secret|token)["']?\s*[=:]\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["password", "secret", "token"]

[[rules]]
id = "pbs-env-credential"
description = "Hard-coded PBS_PASSWORD / PBS_ENCRYPTION_PASSWORD value (placeholders must start with < or $)"
regex = '''(?i)\bPBS_(PASSWORD|ENCRYPTION_PASSWORD)\s*=\s*["']?[^\s"'<$]{4,}'''
keywords = ["pbs_password", "pbs_encryption_password"]
