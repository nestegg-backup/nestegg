openapi: 3.1.0
info:
  title: nestegg local API
  version: 0.3.0
  summary: Local control API of the nestegg daemon.
  description: |
    Served by `nestegg daemon` on the Unix socket `/run/nestegg/api.sock`
    and forwarded unchanged by `nestegg ui` under `http://127.0.0.1:<port>/api/v1/`.

    Conventions
    - All timestamps are RFC 3339 strings in UTC (`2026-11-08T21:30:12Z`).
    - Durations are integer seconds, sizes integer bytes.
    - Unknown fields must be ignored by clients (the API may add fields).
    - Errors use the `Error` schema with a stable machine-readable `code`.
    - When accessed through `nestegg ui`, every API request must carry the
      session token as `Authorization: Bearer <token>`. `nestegg ui` opens
      `http://127.0.0.1:<port>/#token=<token>`; the page reads the token from
      the URL fragment (never sent to a server), stores it in
      `sessionStorage`, removes it from the address bar and sends it with
      every request. No cookies are used (cookies are shared across all ports
      of 127.0.0.1). Static UI files are served without a token.
    - Run IDs look like `20261108T213012Z-manual-a3f9` (random suffix).
    - Permissions: the daemon identifies the caller by the Unix socket
      credentials (for `nestegg ui`: the user who started it). root may
      browse and restore everything; other users (members of group
      `nestegg`) only paths inside their own home directory, and their
      restores are written with their own identity (files owned by them).
      Every caller may change the settings offered by `PATCH /config`
      (decision 0013); server, credentials, encryption and sources stay
      terminal-only.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and version information.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /status:
    get:
      operationId: getStatus
      summary: Everything the dashboard needs in one call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /runs:
    get:
      operationId: listRuns
      summary: Run history, newest first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
    post:
      operationId: startRun
      summary: Start a backup now.
      responses:
        "202":
          description: Accepted; the run is starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409":
          description: A run is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{runId}:
    get:
      operationId: getRun
      summary: One run including the tail of its log.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404":
          description: Unknown run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel the running backup with this ID.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: |
            Cancellation requested. The run normally ends with state
            `cancelled`; if the client had already finished, the run
            completes as `succeeded`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelling: { type: boolean }
        "404":
          description: No running backup with this ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`cannot_cancel`: still starting (retry) or already finishing."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /session:
    get:
      operationId: getSession
      summary: The user on the other end of the socket.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /pbs:
    get:
      operationId: getPbs
      summary: Facts about the backup server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PbsInfo" }
  /pbs/check:
    post:
      operationId: checkPbs
      summary: Run the checks of `nestegg check` (configuration, client, secrets, sources, reachability, login).
      parameters:
        - name: wake
          in: query
          description: Wake the PBS via Wake-on-LAN if it does not answer.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [checks, checked_at]
                properties:
                  checked_at: { type: string, format: date-time }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, ok, detail]
                      properties:
                        name: { type: string, examples: ["PBS reachable"] }
                        ok: { type: boolean }
                        detail: { type: string }
  /machines:
    get:
      operationId: listMachines
      summary: Backup groups (machines) in this PC's PBS namespace with their last status report.
      description: |
        Uses the read-only overview credentials (`[overview]` in the
        configuration) when set up; otherwise only this machine's own
        backups are visible (`complete: false`). The report is the JSON a
        machine stores in the notes of each successful snapshot; failed runs
        create no snapshot and therefore no report.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinesResponse" }
        "503":
          description: PBS not reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /snapshots:
    get:
      operationId: listSnapshots
      summary: Snapshots of this machine on the PBS, newest first.
      description: Requires the PBS to be reachable; returns 503 `pbs_unreachable` otherwise.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
        "503":
          description: PBS not reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /snapshots/{snapshotTime}/browse:
    get:
      operationId: browseSnapshot
      summary: List a directory inside an archive of a snapshot.
      description: |
        The first call for a snapshot reads its catalog from the PBS (needs
        the PBS to be reachable); later calls use a local cache. Users other
        than root see only their own home directory (ancestors show only the
        branch towards it).
      parameters:
        - name: snapshotTime
          in: path
          required: true
          schema: { type: string, format: date-time }
        - name: archive
          in: query
          required: true
          schema: { type: string, examples: ["home.pxar"] }
        - name: path
          in: query
          schema: { type: string, default: "/" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/DirEntry" }
        "403":
          description: Outside the caller's home directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: PBS not reachable (catalog not cached yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /restores:
    post:
      operationId: startRestore
      summary: Restore files from a snapshot into a new directory.
      description: |
        The target directory must not exist yet; for users other than root
        it is created with the caller's identity and the files belong to
        them (ACLs, xattrs, capabilities and sockets are not copied).
        Restores never overwrite existing files. With `archives` (takes
        precedence over `archive`), each archive goes into
        `<target_dir>/<archive name without .pxar>/`; an archive may be
        listed only once. One restore at a time. For non-root callers the
        home directory is mapped onto the archive using the source paths
        recorded in the snapshot's status report; snapshots without that
        information can only be restored by root. Paths are matched
        literally (no globbing). Some problems (e.g. no matching files)
        only show up in the job's `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restore" }
        "400":
          description: Invalid request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Paths outside the caller's home directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`target_exists` or `restore_in_progress`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /restores/{restoreId}:
    get:
      operationId: getRestore
      description: |
        Jobs are kept in memory (last 20) and are visible only to the user
        who started them (and root).
      parameters:
        - name: restoreId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restore" }
        "404":
          description: Unknown job (or started by another user).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /config:
    get:
      operationId: getConfig
      summary: Effective configuration with secrets removed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
    patch:
      operationId: updateConfig
      summary: Change the settings that may be changed from the web UI.
      description: |
        Partial update: only the fields present (and not `null`) change.
        Allowed for every caller (members of group `nestegg` and root);
        the daemon logs the caller and the change to its journal. Only the
        touched keys of `/etc/nestegg/config.toml` are rewritten (comments
        and layout stay); the result is validated before it atomically
        replaces the file. Changes are serialised; a run in progress is not
        affected (it read the configuration when it started), so they are
        also accepted during a run. `automatic_backups` runs
        `systemctl enable|disable --now nestegg-backup.timer` only when the
        state differs; if that fails, the file change is undone and the
        response is 500 `internal`. Server, datastore, namespace, auth id,
        fingerprint, credentials, encryption and sources are rejected with
        400: they can only be changed by root in the terminal
        (decision 0013).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsChange" }
            examples:
              rhythm:
                value: { interval_hours: 12, overdue_after_hours: 30 }
              excludes:
                value: { excludes: ["**/.cache", "**/node_modules", "*.iso"] }
              switches:
                value: { automatic_backups: false, wake_on_lan: true }
      responses:
        "200":
          description: Saved; the new configuration (same as `GET /config`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "400":
          description: |
            `bad_request`: a value is out of range or invalid, a field is
            unknown or terminal-only, or Wake-on-LAN should be switched on
            without a `[wake]` section; also for a body that is not valid
            JSON or is sent without `Content-Type: application/json`.
            Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The caller could not be identified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `internal`: the configuration file is missing or invalid, could
            not be written, or the timer could not be switched (nothing was
            changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, examples: ["20261108T213012Z-timer-a3f9"] }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable identifier.
          enum: [run_in_progress, restore_in_progress, target_exists, cannot_cancel, not_found, pbs_unreachable, not_implemented, bad_request, forbidden, internal]
        message: { type: string, description: Human-readable English text. }
    Health:
      type: object
      required: [version, api_version]
      properties:
        version: { type: string, examples: ["0.1.0"] }
        api_version: { type: string, examples: ["1"] }
    Status:
      type: object
      required: [machine, pbs, schedule, encryption, health]
      properties:
        machine:
          type: object
          required: [hostname, backup_id]
          properties:
            hostname: { type: string, examples: ["desktop"] }
            backup_id: { type: string, examples: ["desktop"] }
            os: { type: string, examples: ["Linux Mint 22.2"] }
        pbs:
          type: object
          required: [server, datastore]
          properties:
            server: { type: string, examples: ["pbs.example.com:8007"] }
            datastore: { type: string, examples: ["backups"] }
            namespace: { type: [string, "null"], examples: ["desktops"] }
            reachable: { type: [boolean, "null"], description: Result of the last check; null if never checked. }
            checked_at: { type: [string, "null"], format: date-time }
            wake_on_lan: { type: boolean, description: "Wake-on-LAN is configured and switched on (`wake.enabled`)." }
        schedule:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            calendar: { type: string, examples: ["every 24 h (checked hourly)"] }
            interval_hours: { type: integer, examples: [24] }
            next_run: { type: [string, "null"], format: date-time }
        current_run:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        last_run:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        last_success:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        health:
          type: string
          description: |
            Summary for the dashboard.
            `ok` – last success within the overdue threshold;
            `running` – a run is in progress;
            `overdue` – no success within the threshold;
            `failing` – the last run failed;
            `incomplete` – the last backup succeeded, but it does not contain
            everything the configuration asks for (see `last_success.incomplete`);
            `never` – no successful backup yet;
            `unconfigured` – setup not finished.
            `failing` and `overdue` take precedence over `incomplete`.
          enum: [ok, running, overdue, failing, incomplete, never, unconfigured]
        overdue_after_hours: { type: integer, examples: [36] }
        encryption:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            key_fingerprint: { type: [string, "null"], description: Fingerprint of the encryption key (not secret). }
            key_exported: { type: boolean, description: The user confirmed that the key was exported (paper key or file). }
        server_verify_failed:
          type: array
          description: Snapshots of this machine that the server's own verification marked as failed, as seen at the end of the last run. Empty or absent if none.
          items: { type: string, examples: ["host/desktop/2026-11-08T21:30:12Z"] }
    Run:
      type: object
      required: [id, trigger, state, started_at]
      properties:
        id: { type: string }
        trigger: { type: string, enum: [timer, manual, cli] }
        state:
          type: string
          enum: [starting, waking_pbs, inventory, uploading, finishing, succeeded, failed, pbs_unreachable, cancelled]
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        duration_seconds: { type: [integer, "null"] }
        snapshot: { type: [string, "null"], examples: ["host/desktop/2026-11-08T21:30:12Z"] }
        archives:
          type: array
          items:
            type: object
            required: [name, source]
            properties:
              name: { type: string, examples: ["home.pxar"] }
              source: { type: string, examples: ["/home"] }
              size_bytes: { type: [integer, "null"] }
        uploaded_bytes: { type: [integer, "null"], description: Uploaded (new) data; updated after each finished archive during a run. }
        expected_bytes: { type: [integer, "null"], description: Total archive size of the last successful run (progress estimate). }
        processed_bytes: { type: [integer, "null"], description: Total size of the archives finished so far in this run. }
        warnings:
          type: array
          items: { type: string }
        incomplete:
          type: array
          description: |
            Why this backup does not contain everything the configuration
            asks for (full system backup skipped, an optional source missing,
            ...). Empty or absent for a complete backup. English text; every
            entry is also in `warnings`.
          items: { type: string }
        verified:
          type: boolean
          description: The snapshot was read back from the server after the upload and matched. Absent in records of older versions.
        error:
          oneOf:
            - $ref: "#/components/schemas/RunError"
            - type: "null"
    RunError:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: "`verification_failed`: the upload finished, but reading the snapshot back from the server failed or did not match."
          enum: [pbs_unreachable, authentication, source_missing, client_missing, client_failed, already_running, config, credentials_unreadable, verification_failed, cancelled, internal]
        message: { type: string }
    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            log_tail:
              type: array
              description: Last lines of the run log (secrets are never logged).
              items: { type: string }
    Snapshot:
      type: object
      required: [time, snapshot]
      properties:
        time: { type: string, format: date-time }
        snapshot: { type: string, examples: ["host/desktop/2026-11-08T21:30:12Z"] }
        size_bytes: { type: [integer, "null"] }
        archives:
          type: array
          items: { type: string, examples: ["home.pxar.didx"] }
        encrypted: { type: [boolean, "null"] }
        verified: { type: [string, "null"], enum: [ok, failed, null] }
        protected: { type: boolean }
        comment: { type: [string, "null"] }
    DirEntry:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [file, directory, symlink, other] }
        size_bytes: { type: [integer, "null"] }
        modified: { type: [string, "null"], format: date-time }
    RestoreRequest:
      type: object
      required: [snapshot_time, target_dir]
      description: Either `archive` (+ `paths`) or `archives`.
      properties:
        snapshot_time: { type: string, format: date-time }
        archive: { type: string, examples: ["home.pxar"] }
        paths:
          type: array
          description: "Paths inside the archive (with everything below them); empty restores the whole archive (for non-root callers: their whole home directory)."
          items: { type: string, examples: ["/alice/Documents/report.odt"] }
        archives:
          type: array
          items:
            type: object
            required: [archive]
            properties:
              archive: { type: string }
              paths: { type: array, items: { type: string } }
        target_dir: { type: string, examples: ["/home/alice/nestegg-restore-2026-11-08"] }
    Restore:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [running, succeeded, failed] }
        target_dir: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        restored_bytes: { type: integer, description: Bytes restored so far (staging copy). }
        total_bytes: { type: [integer, "null"], description: Expected total when whole archives are restored. }
        warnings: { type: array, items: { type: string } }
    ConfigView:
      type: object
      description: Configuration as loaded, without any secret values.
      properties:
        backup_id: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [archive, path]
            properties:
              archive: { type: string }
              path: { type: string }
        excludes:
          type: array
          items: { type: string }
        schedule: { type: string }
        interval_hours: { type: integer }
        encryption: { type: boolean }
        overdue_after_hours: { type: integer }
        automatic_backups: { type: boolean, description: "`nestegg-backup.timer` is enabled." }
        wake_on_lan: { type: boolean, description: Wake-on-LAN is configured and switched on. }
        wake_on_lan_configured: { type: boolean, description: "A `[wake]` section with a MAC address exists; only then can `wake_on_lan` be switched on." }
        editable:
          type: array
          description: Fields `PATCH /config` accepts for this configuration (`wake_on_lan` only when configured).
          items: { type: string, enum: [interval_hours, overdue_after_hours, excludes, wake_on_lan, automatic_backups] }
        limits: { $ref: "#/components/schemas/SettingsLimits" }
    SettingsChange:
      type: object
      additionalProperties: false
      description: Absent or `null` fields stay unchanged.
      properties:
        interval_hours:
          type: [integer, "null"]
          minimum: 1
          maximum: 168
          description: |
            A backup runs when the last success is older than this (the timer
            checks hourly; there is no time of day).
        overdue_after_hours:
          type: [integer, "null"]
          minimum: 2
          maximum: 744
          description: Must be greater than `interval_hours` (checked when either changes).
        excludes:
          type: [array, "null"]
          description: |
            The complete new list (replaces the old one; send the current
            list with items added or removed). `proxmox-backup-client
            --exclude` syntax. At most 200 patterns, each 1-256 characters,
            no control characters, no leading or trailing spaces, no
            duplicates, and no pattern that matches everything (`*`, `**`,
            `/`, `/*`, `**/*`, ...).
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 256 }
        wake_on_lan:
          type: [boolean, "null"]
          description: Sets `wake.enabled`; the MAC address is kept when switching off. `true` needs a `[wake]` section.
        automatic_backups:
          type: [boolean, "null"]
          description: Enable or disable `nestegg-backup.timer` (`systemctl enable|disable --now`).
    SettingsLimits:
      type: object
      properties:
        interval_hours:
          type: object
          properties: { min: { type: integer }, max: { type: integer } }
        overdue_after_hours:
          type: object
          properties:
            min: { type: integer }
            max: { type: integer }
            greater_than_interval: { type: boolean }
        excludes:
          type: object
          properties: { max_items: { type: integer }, max_length: { type: integer } }
    SessionInfo:
      type: object
      required: [user, home, uid, root]
      properties:
        user: { type: string, examples: ["alice"] }
        home: { type: string, examples: ["/home/alice"] }
        uid: { type: integer }
        root: { type: boolean }
    PbsInfo:
      type: object
      required: [server, datastore, reachable, overview_configured]
      properties:
        server: { type: string, examples: ["pbs.example.com:8007"] }
        datastore: { type: string }
        namespace: { type: [string, "null"] }
        reachable: { type: boolean }
        used_bytes: { type: [integer, "null"], description: Needs read access to the datastore status; null otherwise. }
        total_bytes: { type: [integer, "null"] }
        overview_configured: { type: boolean }
    MachinesResponse:
      type: object
      required: [read_at, complete, machines]
      properties:
        read_at: { type: string, format: date-time }
        complete: { type: boolean, description: false if only this machine's own backups are visible (no overview credentials). }
        machines:
          type: array
          items:
            type: object
            required: [backup_id, recent_snapshots]
            properties:
              backup_id: { type: string, examples: ["media"] }
              hostname: { type: [string, "null"] }
              os: { type: [string, "null"] }
              last_snapshot: { type: [string, "null"], format: date-time }
              recent_snapshots:
