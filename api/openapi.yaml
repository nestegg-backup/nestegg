openapi: 3.1.0
info:
  title: nestegg local API
  version: 0.4.0
  summary: Local control API of the nestegg daemon.
  description: |
    Served by `nestegg daemon` on the Unix socket `/run/nestegg/api.sock`
    and forwarded unchanged by `nestegg ui` under `http://127.0.0.1:<port>/api/v1/`.

    Conventions
    - All timestamps are RFC 3339 strings in UTC (`2026-11-08T21:30:12Z`).
    - Durations are integer seconds, sizes integer bytes.
    - Unknown fields must be ignored by clients (the API may add fields).
    - Errors use the `Error` schema with a stable machine-readable `code`.
    - When accessed through `nestegg ui`, every API request must carry the
      session token as `Authorization: Bearer <token>`. `nestegg ui` opens
      `http://127.0.0.1:<port>/#token=<token>`; the page reads the token from
      the URL fragment (never sent to a server), stores it in
      `sessionStorage`, removes it from the address bar and sends it with
      every request. No cookies are used (cookies are shared across all ports
      of 127.0.0.1). Static UI files are served without a token.
    - Run IDs look like `20261108T213012Z-manual-a3f9` (random suffix).
    - Permissions: the daemon identifies the caller by the Unix socket
      credentials (for `nestegg ui`: the user who started it). root may
      browse and restore everything; other users (members of group
      `nestegg`) only paths inside their own home directory, and their
      restores are written with their own identity (files owned by them).
      Every caller may change the settings offered by `PATCH /config`
      (decision 0013); server, credentials, encryption and sources stay
      terminal-only.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and version information.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /status:
    get:
      operationId: getStatus
      summary: Everything the dashboard needs in one call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /runs:
    get:
      operationId: listRuns
      summary: Run history, newest first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
    post:
      operationId: startRun
      summary: Start a backup now.
      responses:
        "202":
          description: Accepted; the run is starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409":
          description: A run is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /targets/{target}/runs:
    parameters:
      - name: target
        in: path
        required: true
        schema: { type: string, enum: [pbs, stick, all] }
    get:
      operationId: listTargetRuns
      summary: Up to 200 runs of this target, newest first, including the active run.
      responses:
        "200":
          description: Target history; old records without a target belong to PBS.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        "400":
          description: Unknown target.
    post:
      operationId: startTargetRun
      summary: Back up to stick, PBS, or all configured targets now.
      description: |
        No body. Uses the shared run lock. With all, the stick runs first.
        The response identifies the first run; following runs appear in history.
        An absent stick ends as stick_not_plugged_in, without counting as failure.
      responses:
        "202":
          description: Accepted; follow current_run and per-target history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400":
          description: Unknown or unconfigured target.
        "409":
          description: A backup is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{runId}:
    get:
      operationId: getRun
      summary: One run including the tail of its log.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404":
          description: Unknown run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel the running backup with this ID.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: |
            Cancellation requested. The run normally ends with state
            `cancelled`, and its error message names the caller ("cancel
            requested by alice (uid 1000)"); the daemon also logs it. If
            the upload had already finished but the read-back check had
            not, the run also ends as `cancelled` (the snapshot stays on
            the server, unverified); after the check it completes as
            `succeeded`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelling: { type: boolean }
        "404":
          description: "`not_found`: no run with this ID exists (or it is not a valid run ID)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `cannot_cancel`: the run exists but cannot be cancelled. Either it
            is still starting and has not published its process yet (try
            again in a moment), or it is already over (succeeded, failed,
            cancelled). The message says which of the two.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /session:
    get:
      operationId: getSession
      summary: The user on the other end of the socket.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /pbs:
    get:
      operationId: getPbs
      summary: Facts about the backup server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PbsInfo" }
  /pbs/check:
    post:
      operationId: checkPbs
      summary: Run the checks of `nestegg check` (configuration, client, secrets, sources, reachability, login).
      description: |
        Always answers 200 (or 409 while another check runs); problems are
        items. An item is `passed`, `failed`, or `not_checked`. A check that
        could not be made is never reported as passed: a server that does not
        answer while Wake-on-LAN is configured and no wake was requested is
        `not_checked` ("PBS reachable"), and so are the checks that need
        the server ("PBS login and datastore access", "overview access").
        With `wake=true` the server is woken first (this may take minutes);
        if it still does not answer, "PBS reachable" is `failed`. Without
        Wake-on-LAN, a server that does not answer is `failed`.

        Only one check runs at a time: a request made while one is running is
        refused with 409 `already_checking`; a check whose caller went away
        still finishes, and counts as running until it has. There is also a
        minimum interval between wake attempts: a wake asked for less than a
        minute after a check that really sent a wake-up packet is skipped
        (`wake_skipped: true`) and the check runs without sending another
        wake-up burst. A check in which no packet was sent (the server
        answered at once, Wake-on-LAN off or not configured, every send
        failed) does not start that minute.
      parameters:
        - name: wake
          in: query
          description: Wake the PBS via Wake-on-LAN if it does not answer.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [checks, checked_at]
                properties:
                  checked_at: { type: string, format: date-time }
                  wake_skipped:
                    type: boolean
                    description: A wake was asked for but skipped because a wake-up packet was sent less than a minute ago (minimum interval between wake attempts).
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, ok, detail]
                      properties:
                        name: { type: string, examples: ["PBS reachable"] }
                        status:
                          type: string
                          enum: [passed, failed, not_checked]
                          description: |
                            Absent in answers of older daemons, which knew
                            only `ok`; treat `ok: true` as `passed` and
                            `ok: false` as `failed` then.
                        ok:
                          type: boolean
                          description: |
                            `status == passed`. A check that was not made
                            has `ok: false`, so a client that only knows
                            `ok` shows it as a problem, never as fine.
                        detail: { type: string }
        "409":
          description: Another PBS check is already running (`already_checking`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /machines:
    get:
      operationId: listMachines
      summary: Backup groups (machines) in this PC's PBS namespace with their last status report.
      description: |
        Uses the read-only overview credentials (`[overview]` in the
        configuration) when set up; otherwise only this machine's own
        backups are visible (`complete: false`). The report is the JSON a
        machine stores in the notes of each successful snapshot; failed runs
        create no snapshot and therefore no report.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinesResponse" }
        "503":
          description: PBS not reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /snapshots:
    get:
      operationId: listSnapshots
      summary: Snapshots of this machine on the PBS, newest first.
      description: Requires the PBS to be reachable; returns 503 `pbs_unreachable` otherwise.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
        "503":
          description: PBS not reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /snapshots/{snapshotTime}/browse:
    get:
      operationId: browseSnapshot
      summary: List a directory inside an archive of a snapshot.
      description: |
        The first call for a snapshot reads its catalog from the PBS (needs
        the PBS to be reachable); later calls use a local cache. Users other
        than root see only their own home directory (ancestors show only the
        branch towards it).
      parameters:
        - name: snapshotTime
          in: path
          required: true
          schema: { type: string, format: date-time }
        - name: archive
          in: query
          required: true
          schema: { type: string, examples: ["home.pxar"] }
        - name: path
          in: query
          schema: { type: string, default: "/" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/DirEntry" }
        "403":
          description: |
            Outside the caller's home directory, or (for non-root callers) a
            snapshot without backup metadata and without a local run record
            (decision 0016).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: PBS not reachable (catalog not cached yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /restores:
    post:
      operationId: startRestore
      summary: Restore files from a snapshot into a new directory.
      description: |
        The target directory must not exist yet; for users other than root
        it is created with the caller's identity and the files belong to
        them (ACLs, xattrs, capabilities and sockets are not copied).
        Restores never overwrite existing files. With `archives` (takes
        precedence over `archive`), each archive goes into
        `<target_dir>/<archive name without .pxar>/`; an archive may be
        listed only once. One restore at a time. For non-root callers the
        home directory is mapped onto the archive using the source paths
        in the snapshot's metadata blob (`nestegg-meta.conf`) or, for
        snapshots of older versions, in the local run record of that
        snapshot; never the snapshot notes (decision 0016). Snapshots
        with neither can only be restored by root (403 `forbidden`). Paths are matched
        literally (no globbing). Some problems (e.g. no matching files)
        only show up in the job's `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restore" }
        "400":
          description: Invalid request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Paths outside the caller's home directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`target_exists` or `restore_in_progress`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /restores/{restoreId}:
    get:
      operationId: getRestore
      description: |
        Jobs are kept in memory (last 20) and are visible only to the user
        who started them (and root).
      parameters:
        - name: restoreId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restore" }
        "404":
          description: Unknown job (or started by another user).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /config:
    get:
      operationId: getConfig
      summary: Effective configuration with secrets removed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
    patch:
      operationId: updateConfig
      summary: Change the settings that may be changed from the web UI.
      description: |
        Partial update: only the fields present (and not `null`) change.
        Allowed for every caller (members of group `nestegg` and root);
        the daemon logs the caller and the change to its journal. Only the
        touched keys of `/etc/nestegg/config.toml` are rewritten (comments
        and layout stay); the result is validated before it atomically
        replaces the file. Changes are serialised; a run in progress is not
        affected (it read the configuration when it started), so they are
        also accepted during a run. `automatic_backups` runs
        `systemctl enable|disable --now nestegg-backup.timer` only when the
        state differs; if that fails, the file change is undone and the
        response is 500 `internal`. Server, datastore, namespace, auth id,
        fingerprint, credentials, encryption and sources are rejected with
        400: they can only be changed by root in the terminal
        (decision 0013).
        A change by a group member that lowers the protection (automatic
        backups off, an exclude added, "overdue after" or the interval
        raised, Wake-on-LAN off) is reported to the logged-in users and the
        notification hook, naming who changed what (decision 0022); a change
        by root is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsChange" }
            examples:
              rhythm:
                value: { interval_hours: 12, overdue_after_hours: 30 }
              excludes:
                value: { excludes: ["**/.cache", "**/node_modules", "*.iso"] }
              switches:
                value: { automatic_backups: false, wake_on_lan: true }
      responses:
        "200":
          description: Saved; the new configuration (same as `GET /config`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "400":
          description: |
            `bad_request`: a value is out of range or invalid, a field is
            unknown or terminal-only, or Wake-on-LAN should be switched on
            without a `[wake]` section; also for a body that is not valid
            JSON or is sent without `Content-Type: application/json`.
            Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The caller could not be identified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `internal`: the configuration file is missing or invalid, could
            not be written, or the timer could not be switched (nothing was
            changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, examples: ["20261108T213012Z-timer-a3f9"] }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable identifier.
          enum: [run_in_progress, restore_in_progress, target_exists, cannot_cancel, already_checking, not_found, pbs_unreachable, not_implemented, bad_request, forbidden, internal]
        message: { type: string, description: Human-readable English text. }
    Health:
      type: object
      required: [version, api_version]
      properties:
        version: { type: string, examples: ["0.1.0"] }
        api_version: { type: string, examples: ["1"] }
    TargetStatus:
      type: object
      required: [health, state, consecutive_failures, overdue_after_hours, password_reminder]
      properties:
        health: { type: string, enum: [ok, running, overdue, failing, incomplete, never, unconfigured] }
        state:
          type: string
          description: Availability or target-specific state alongside independently computed health.
          enum: [ok, running, overdue, failing, incomplete, never, unconfigured, stick_full, stick_not_plugged_in]
        last_run:
          oneOf: [{ $ref: "#/components/schemas/Run" }, { type: "null" }]
        last_success:
          oneOf: [{ $ref: "#/components/schemas/Run" }, { type: "null" }]
        current_run:
          oneOf: [{ $ref: "#/components/schemas/Run" }, { type: "null" }]
        consecutive_failures: { type: integer, minimum: 0 }
        overdue_after_hours: { type: integer, description: Stick default is 168 hours (7 days). }
        next_run: { type: [string, "null"], format: date-time }
        available_bytes: { type: [integer, "null"], description: Free space as reported for the PBS backup user. }
        full_verified_at: { type: [string, "null"], format: date-time }
        server_verify_failed: { type: array, items: { type: string } }
        password_reminder: { type: boolean, description: A registered stick has no password proof or needs its 180-day password re-check. Use the root-only CLI key-check action; the API never accepts passwords. }
    Status:
      type: object
      required: [machine, pbs, schedule, encryption, health]
      description: |
        Legacy fields describe PBS when configured, otherwise the sole stick target.
        The pbs object stays present (empty server/datastore in stick-only setups).
        New clients should use targets for independent target health and histories.
      properties:
        targets:
          type: object
          description: Only configured targets; old daemons may omit it.
          properties:
            pbs: { $ref: "#/components/schemas/TargetStatus" }
            stick: { $ref: "#/components/schemas/TargetStatus" }
        machine:
          type: object
          required: [hostname, backup_id]
          properties:
            hostname: { type: string, examples: ["desktop"] }
            backup_id: { type: string, examples: ["desktop"] }
            os: { type: string, examples: ["Linux Mint 22.2"] }
        pbs:
          type: object
          required: [server, datastore]
          properties:
            server: { type: string, examples: ["pbs.example.com:8007"] }
            datastore: { type: string, examples: ["backups"] }
            namespace: { type: [string, "null"], examples: ["desktops"] }
            reachable: { type: [boolean, "null"], description: "Whether the server answered at the newest of the last backup run and the last `POST /pbs/check` (the check is remembered until the daemon restarts); null if never checked." }
            checked_at: { type: [string, "null"], format: date-time }
            wake_on_lan: { type: boolean, description: "Wake-on-LAN is configured and switched on (`wake.enabled`)." }
            credentials_stored: { type: [boolean, "null"], description: "The token secret (or password) is stored on this computer (`nestegg credentials set-password`). Null or absent: unknown." }
        schedule:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            calendar: { type: string, examples: ["every 24 h (checked hourly)"] }
            interval_hours: { type: integer, examples: [24] }
            next_run: { type: [string, "null"], format: date-time }
        current_run:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        last_run:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        last_success:
          oneOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        health:
          type: string
          description: |
            Summary for the dashboard.
            `ok` – last success within the overdue threshold;
            `running` – a run is in progress;
            `overdue` – no success within the threshold, or the time of the
            last success lies more than five minutes in the future (the
            clock was wrong when it was recorded; a backup is then due at
            once and `schedule.next_run` is now);
            `failing` – the last run failed;
            `incomplete` – the last backup succeeded, but it does not contain
            everything the configuration asks for (see `last_success.incomplete`);
            `never` – no successful backup yet;
            `unconfigured` – setup not finished.
            `failing` and `overdue` take precedence over `incomplete`.
          enum: [ok, running, overdue, failing, incomplete, never, unconfigured]
        overdue_after_hours: { type: integer, examples: [36] }
        encryption:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            key_fingerprint: { type: [string, "null"], description: Fingerprint of the encryption key (not secret). }
            key_exported: { type: boolean, description: The user proved with a copy of the key or the check code of the paper key that a copy exists outside this computer. }
            key_present: { type: [boolean, "null"], description: "An encryption key is stored on this computer (`nestegg key create` or `key import`); it may still be unconfirmed. Null or absent: unknown." }
        server_verify_failed:
          type: array
          description: Snapshots of this machine that the server's own verification marked as failed, as seen at the end of the last run. Empty or absent if none.
          items: { type: string, examples: ["host/desktop/2026-11-08T21:30:12Z"] }
    Run:
      type: object
      required: [id, trigger, state, started_at]
      properties:
        target: { type: string, enum: [pbs, stick], description: Absent in older records means pbs. }
        stick_uuid: { type: [string, "null"], format: uuid, description: Physical medium used by this stick run. }
        id: { type: string }
        trigger: { type: string, enum: [timer, manual, cli, plug, unknown] }
        state:
          type: string
          description: "`unknown`: a value written by a newer version this one does not recognise (forward compatibility)."
          enum: [starting, waking_pbs, inventory, uploading, finishing, succeeded, failed, pbs_unreachable, stick_not_plugged_in, cancelled, unknown]
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        duration_seconds: { type: [integer, "null"] }
        snapshot: { type: [string, "null"], examples: ["host/desktop/2026-11-08T21:30:12Z"] }
        archives:
          type: array
          items:
            type: object
            required: [name, source]
            properties:
              name: { type: string, examples: ["home.pxar"] }
              source: { type: string, examples: ["/home"] }
              size_bytes: { type: [integer, "null"] }
        uploaded_bytes: { type: [integer, "null"], description: Uploaded (new) data; updated after each finished archive during a run. }
        expected_bytes: { type: [integer, "null"], description: Total archive size of the last successful run (progress estimate). }
        processed_bytes: { type: [integer, "null"], description: Total size of the archives finished so far in this run. }
        warnings:
          type: array
          items: { type: string }
        incomplete:
          type: array
          description: |
            Why this backup does not contain everything the configuration
            asks for (full system backup skipped, an optional source missing,
            ...). Empty or absent for a complete backup. English text; every
            entry is also in `warnings`.
          items: { type: string }
        verified:
          type: boolean
          description: The snapshot was read back from the server after the upload and matched. Absent in records of older versions.
        transient:
          type: boolean
          description: |
            Only on a failed run: the failure is a server-availability problem,
            not a persistent fault (the server was unreachable or stopped
            answering during the read-back, so the snapshot may exist but
            nothing was proven). Reported as `verification_failed`, but, like
            `pbs_unreachable`, it does not pause the automatic retries. Only
            the first such failure in a row is transient; the next one
            directly after it is an ordinary failure (decision 0015). Absent
            (false) otherwise and in records of older versions.
        error:
          oneOf:
            - $ref: "#/components/schemas/RunError"
            - type: "null"
    RunError:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: "`verification_failed`: the upload finished, but reading the snapshot back from the server failed or did not match. `already_running`: the run did not start because another backup run held the run lock (state `cancelled`). `internal` also covers a run lock that could not be taken although no backup was running (the message names the holders). `unknown`: a kind written by a newer version this one does not recognise (forward compatibility)."
          enum: [stick_not_plugged_in, stick_full, stick_already_mounted, stick_ambiguous, stick_busy, filesystem_damaged, stick_unsupported, key_mismatch, pbs_unreachable, authentication, source_missing, client_missing, client_failed, already_running, config, credentials_unreadable, verification_failed, cancelled, internal, unknown]
        message: { type: string }
    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            log_tail:
              type: array
              description: Last lines of the run log (secrets are never logged).
              items: { type: string }
    Snapshot:
      type: object
      required: [time, snapshot]
      properties:
        time: { type: string, format: date-time }
        snapshot: { type: string, examples: ["host/desktop/2026-11-08T21:30:12Z"] }
        size_bytes: { type: [integer, "null"] }
        archives:
          type: array
          items: { type: string, examples: ["home.pxar.didx"] }
        encrypted: { type: [boolean, "null"] }
        verified: { type: [string, "null"], enum: [ok, failed, null] }
        protected: { type: boolean }
        comment: { type: [string, "null"] }
    DirEntry:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [file, directory, symlink, other] }
        size_bytes: { type: [integer, "null"] }
        modified: { type: [string, "null"], format: date-time }
    RestoreRequest:
      type: object
      required: [snapshot_time, target_dir]
      description: Either `archive` (+ `paths`) or `archives`.
      properties:
        snapshot_time: { type: string, format: date-time }
        archive: { type: string, examples: ["home.pxar"] }
        paths:
          type: array
          description: "Paths inside the archive (with everything below them); empty restores the whole archive (for non-root callers: their whole home directory)."
          items: { type: string, examples: ["/alice/Documents/report.odt"] }
        archives:
          type: array
          items:
            type: object
            required: [archive]
            properties:
              archive: { type: string }
              paths: { type: array, items: { type: string } }
        target_dir: { type: string, examples: ["/home/alice/nestegg-restore-2026-11-08"] }
    Restore:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [running, succeeded, failed] }
        target_dir: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        restored_bytes: { type: integer, description: Bytes restored so far (staging copy). }
        total_bytes: { type: [integer, "null"], description: Expected total when whole archives are restored. }
        warnings: { type: array, items: { type: string } }
    ConfigView:
      type: object
      description: Configuration as loaded, without any secret values.
      properties:
        backup_id: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [archive, path]
            properties:
              archive: { type: string }
              path: { type: string }
        excludes:
          type: array
          items: { type: string }
        schedule: { type: string }
        interval_hours: { type: integer }
        encryption: { type: boolean }
        overdue_after_hours: { type: integer }
        stick_overdue_after_hours: { type: [integer, "null"] }
        automatic_backups: { type: boolean, description: "`nestegg-backup.timer` is enabled." }
        wake_on_lan: { type: boolean, description: Wake-on-LAN is configured and switched on. }
        wake_on_lan_configured: { type: boolean, description: "A `[wake]` section with a MAC address exists; only then can `wake_on_lan` be switched on." }
        editable:
          type: array
          description: Fields `PATCH /config` accepts for this configuration (`wake_on_lan` only when configured).
          items: { type: string, enum: [interval_hours, overdue_after_hours, stick_overdue_after_hours, remove_target, excludes, wake_on_lan, automatic_backups] }
        limits: { $ref: "#/components/schemas/SettingsLimits" }
    SettingsChange:
      type: object
      additionalProperties: false
      description: Absent or `null` fields stay unchanged.
      properties:
        stick_overdue_after_hours:
          type: [integer, "null"]
          minimum: 1
          description: Stick warning threshold; same cap as PBS. Raising it announces reduced protection.
        remove_target:
          type: [string, "null"]
          enum: [pbs, stick, null]
          description: Remove one of two configured targets. The last target cannot be removed. Announces reduced protection.
        interval_hours:
          type: [integer, "null"]
          minimum: 1
          maximum: 168
          description: |
            A backup runs when the last success is older than this (the timer
            checks hourly; there is no time of day).
        overdue_after_hours:
          type: [integer, "null"]
          minimum: 2
          description: |
            Must be greater than `interval_hours` (checked when either
            changes). Through this API at most 168 h (7 days) or
            `interval_hours` + 72 h, whichever is larger, evaluated against
            the interval in effect after the same request (a weekly rhythm
            may be overdue after up to 240 h); a longer time can only be set
            as root in the file. A value above that cap is kept and can only
            be lowered here (decision 0022). `limits.overdue_after_hours`
            reports the numbers of this rule.
        excludes:
          type: [array, "null"]
          description: |
            The complete new list (replaces the old one; send the current
            list with items added or removed). `proxmox-backup-client
            --exclude` syntax. At most 200 patterns, each 1-256 bytes, no
            control characters or invisible Unicode format characters, no
            leading or trailing spaces, no duplicates, no leading `-`, no
            pattern the backup client cannot parse (an unclosed `[`…`]` class, a
            trailing `\`, `[a-]`), and no pattern that matches everything (`*`,
            `**`, `/`, `/*`, `**/*`, ...). A change is refused when its whole new
            list, evaluated with the backup client's own matcher inside each
            archive it really produces (later patterns win), would leave out a
            whole configured source, a whole home directory of a regular user
            inside a source (or a parent directory of one), or (full system
            backup) a whole top-level system directory that the old list did not
            — whatever the spelling (`/alice`, `alice`, `**/alice`, `/[a-z]*`,
            `/alice/[.a-zA-Z]*`, …); the message names the folder. To judge this
            the daemon may read a folder's top-level entry names with the
            requester's own permissions, never as root, so the answer never
            reveals a name the requester could not list themselves. A folder the
            old list already left out is kept (decision 0022).
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 256 }
        wake_on_lan:
          type: [boolean, "null"]
          description: Sets `wake.enabled`; the MAC address is kept when switching off. `true` needs a `[wake]` section.
        automatic_backups:
          type: [boolean, "null"]
          description: Enable or disable `nestegg-backup.timer` (`systemctl enable|disable --now`).
    SettingsLimits:
      type: object
      properties:
        interval_hours:
          type: object
          properties: { min: { type: integer }, max: { type: integer } }
        overdue_after_hours:
          type: object
          description: |
            `max` is the effective cap for the interval currently in the file:
            `max(base, interval + per_interval_extra)`, and never below a larger
            value root already set (which can then only be lowered through the
            API; decision 0022). Both keys can change in one request, so the web
            interface recomputes the cap from `base` and `per_interval_extra`
            for the interval it is about to set (so a weekly rhythm can be
            overdue after up to 10 days).
          properties:
            min: { type: integer }
            max: { type: integer }
            greater_than_interval: { type: boolean }
            base: { type: integer, description: "Base cap in hours (168)." }
            per_interval_extra: { type: integer, description: "Hours added on top of the interval (72)." }
            file_minimum: { type: integer, description: "A larger value already in the file; the cap is never below it." }
        excludes:
          type: object
          description: "`max_length` is a byte count (decision 0022)."
          properties: { max_items: { type: integer }, max_length: { type: integer } }
    SessionInfo:
      type: object
      required: [user, home, uid, root]
      properties:
        user: { type: string, examples: ["alice"] }
        home: { type: string, examples: ["/home/alice"] }
        uid: { type: integer }
        root: { type: boolean }
    PbsInfo:
      type: object
      required: [server, datastore, reachable, overview_configured]
      properties:
        server: { type: string, examples: ["pbs.example.com:8007"] }
        datastore: { type: string }
        namespace: { type: [string, "null"] }
        reachable: { type: boolean }
        used_bytes: { type: [integer, "null"], description: Needs read access to the datastore status; null otherwise. }
        total_bytes: { type: [integer, "null"] }
        overview_configured: { type: boolean }
    MachinesResponse:
      type: object
      required: [read_at, complete, machines]
      properties:
        read_at: { type: string, format: date-time }
        complete: { type: boolean, description: false if only this machine's own backups are visible (no overview credentials). }
        machines:
          type: array
          items:
            type: object
            required: [backup_id, recent_snapshots]
            properties:
              backup_id: { type: string, examples: ["media"] }
              hostname: { type: [string, "null"] }
              os: { type: [string, "null"] }
              last_snapshot: { type: [string, "null"], format: date-time }
              recent_snapshots:
                type: array
                description: Snapshot times of the last 14 days, newest first.
                items: { type: string, format: date-time }
              size_bytes: { type: [integer, "null"] }
              report:
                description: |
                  Status report from the notes of the last snapshot. For
                  display only: notes can be changed by anyone with write
                  access to the backup group and are never used for
                  permissions (decision 0016).
                type: [object, "null"]
                properties:
                  reported_at: { type: string, format: date-time }
                  result: { type: string, enum: [succeeded] }
                  run_started_at: { type: string, format: date-time }
                  hostname: { type: string }
                  os: { type: [string, "null"] }
                  key_exported: { type: [boolean, "null"] }
                  sources: { type: array, items: { type: string } }
                  overdue_after_hours: { type: integer }
                  nestegg_version: { type: string }
                  uploaded_bytes: { type: [integer, "null"] }
                  duration_seconds: { type: integer }
                  incomplete:
                    type: array
                    description: Why the backup is incomplete (decision 0015); empty or absent if complete.
                    items: { type: string }
                  verified: { type: boolean, description: The snapshot was read back after the upload. Absent in reports of older versions. }
